<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">e-Builder Document Q and A Workflow</title>
  <desc id="desc">Five-step workflow from show invoice to content answer</desc>
  <rect width="1200" height="360" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#0f172a">e-Builder Document Q&amp;A Workflow</text>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="100" width="190" height="120" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">1. User</text>
    <text x="135" y="160" text-anchor="middle" font-size="12" fill="#1e40af">"Show invoice for</text>
    <text x="135" y="178" text-anchor="middle" font-size="12" fill="#1e40af">ESRI 006A"</text>

    <rect x="260" y="100" width="190" height="120" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="355" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">2. MCP</text>
    <text x="355" y="162" text-anchor="middle" font-size="12" fill="#4338ca">get_invoice_document</text>
    <text x="355" y="182" text-anchor="middle" font-size="12" fill="#4338ca">’ fileId + downloadUrl</text>

    <rect x="480" y="100" width="190" height="120" rx="12" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="575" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#115e59">3. Chatbot</text>
    <text x="575" y="162" text-anchor="middle" font-size="12" fill="#0f766e">Download DOCX/PDF</text>
    <text x="575" y="182" text-anchor="middle" font-size="12" fill="#0f766e">Extract text ’ cache</text>

    <rect x="700" y="100" width="190" height="120" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="795" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">4. User</text>
    <text x="795" y="162" text-anchor="middle" font-size="12" fill="#1e40af">"What is in this</text>
    <text x="795" y="182" text-anchor="middle" font-size="12" fill="#1e40af">invoice?"</text>

    <rect x="920" y="100" width="240" height="120" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1040" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">5. Agent</text>
    <text x="1040" y="162" text-anchor="middle" font-size="12" fill="#166534">Uses Linked e-Builder</text>
    <text x="1040" y="182" text-anchor="middle" font-size="12" fill="#166534">documents text or</text>
    <text x="1040" y="200" text-anchor="middle" font-size="12" fill="#166534">getLinkedDocuments</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <path d="M230 160 L260 160" marker-end="url(#a)"/>
    <path d="M450 160 L480 160" marker-end="url(#a)"/>
    <path d="M670 160 L700 160" marker-end="url(#a)"/>
    <path d="M890 160 L920 160" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Same-turn: onStepFinish prefetches text after MCP · Follow-up: history scan + linkedDocumentsPrompt auto-inject</text>
</svg>
