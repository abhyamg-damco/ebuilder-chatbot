# Build and deploy vercel-nextjs-chatbot to Cloud Run (dev) when the app or workflow changes.
name: Deploy Chatbot to Cloud Run (Dev)

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dev-deploy-chatbot.yml
      - .github/workflows/scripts/cloud-run-env-from-dotenv.py
      - "vercel-nextjs-chatbot/**"
  workflow_dispatch:

concurrency:
  group: dev-deploy-chatbot-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: dev-chatbot
  SERVICE_ACCOUNT: ${{ vars.CHATBOT_GCP_SERVICE_ACCOUNT_EMAIL }}
  SECRET_NAME: DEV-CHATBOT
  IMAGE_NAME: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ebuilder/dev/dev-chatbot
  # Must match Dockerfile EXPOSE and Next.js PORT.
  CLOUD_RUN_PORT: "8080"

jobs:
  setup-build-publish-deploy:
    name: Build and Deploy Chatbot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    environment: dev-chatbot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Parse environment secrets
        id: parse-secrets
        run: |
          set -euo pipefail

          FULL_SECRET=$(gcloud secrets versions access latest \
            --secret="$SECRET_NAME" \
            --format="get(payload.data)" | base64 --decode)

          if [[ -z "${FULL_SECRET//[$'\t\r\n ']}" ]]; then
            echo "::error::Secret $SECRET_NAME decoded to empty payload; check secret exists and base64 payload."
            exit 1
          fi

          echo "$FULL_SECRET" > /tmp/all.env
          echo "Decoded secret byte size: $(wc -c < /tmp/all.env) (includes newlines)"

          KEY_NAMES_FILE=$(mktemp)
          COUNT=0

          while IFS= read -r line; do
            [[ -z "$line" || "${line:0:1}" == "#" ]] && continue

            KEY=${line%%=*}
            VALUE=${line#*=}

            if [[ -z "$KEY" || -z "$VALUE" ]]; then
              echo "⚠️ skipping malformed line: $line" >&2
              continue
            fi

            echo "$KEY=$VALUE" >> "$GITHUB_ENV"
            echo "::add-mask::$VALUE"
            echo "$KEY" >> "$KEY_NAMES_FILE"
            COUNT=$((COUNT + 1))
          done < /tmp/all.env

          echo "Loaded $COUNT key(s) into GITHUB_ENV (names only, sorted):"
          sort -u "$KEY_NAMES_FILE" | tee /tmp/env-key-names.txt
          rm -f "$KEY_NAMES_FILE"

          python3 .github/workflows/scripts/cloud-run-env-from-dotenv.py /tmp/all.env /tmp/cloud-run-env.yaml

          if [[ -f /tmp/cloud-run-env.yaml ]]; then
            echo "Cloud Run env-vars-file lines (keys only; values redacted):"
            sed -E 's/^([^:]+):.*/\1/' /tmp/cloud-run-env.yaml || true
            echo "cloud-run-env.yaml size (bytes): $(wc -c < /tmp/cloud-run-env.yaml)"
          else
            echo "::warning::/tmp/cloud-run-env.yaml missing after conversion"
          fi

          for k in POSTGRES_URL AUTH_SECRET AUTH_TRUST_HOST OPENAI_API_KEY; do
            if grep -qx "$k" /tmp/env-key-names.txt 2>/dev/null; then
              echo "$k is present in secret"
            else
              echo "::warning::$k missing from secret — chatbot may fail at runtime"
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vercel-nextjs-chatbot/pnpm-lock.yaml

      - name: Run database migrations
        working-directory: vercel-nextjs-chatbot
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx lib/db/migrate.ts

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            -f vercel-nextjs-chatbot/Dockerfile \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            vercel-nextjs-chatbot

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -s /tmp/cloud-run-env.yaml ]]; then
            EXTRA+=(--env-vars-file=/tmp/cloud-run-env.yaml)
            echo "Deploy will use --env-vars-file ($(wc -l < /tmp/cloud-run-env.yaml) line(s))"
          else
            echo "::warning::No /tmp/cloud-run-env.yaml (or empty); Cloud Run service env will not be updated from secret"
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --port "$CLOUD_RUN_PORT" \
            --service-account="$SERVICE_ACCOUNT" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=900s \
            "${EXTRA[@]}"

      - name: Show service URL
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --platform managed \
            --region "$REGION" \
            --format 'value(status.url)')
          echo "::notice::Chatbot deployed to $SERVICE_URL"
